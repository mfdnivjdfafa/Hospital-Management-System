
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medicine Stock Tracking | HMS</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 30px;
      background: #f3f6fa;
      color: #243247;
    }
    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 10px;
    }
    h1 { color: #176b55; }
    form {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }
    input, button {
      padding: 10px;
      font-size: 15px;
    }
    input { flex: 1; min-width: 130px; }
    button {
      border: 0;
      border-radius: 5px;
      background: #176b55;
      color: white;
      cursor: pointer;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }
    th, td {
      padding: 12px;
      border: 1px solid #dce3ea;
      text-align: left;
    }
    th { background: #e6f2ee; }
    .low { color: #b42318; font-weight: bold; }
    .message { margin: 12px 0; }
  </style>
</head>
<body>
  <main class="container">
    <h1>Medicine Stock Tracking</h1>
    <p>Hospital Management System — Pharmacy & Inventory</p>

    <form id="medicineForm">
      <input id="medicineName" placeholder="Medicine name" required>
      <input id="quantity" type="number" min="0" placeholder="Quantity" required>
      <input id="reorderLevel" type="number" min="0" placeholder="Reorder level" required>
      <button type="submit">Add Medicine</button>
    </form>

    <p id="message" class="message" role="status"></p>

    <table>
      <thead>
        <tr>
          <th>Medicine</th>
          <th>Quantity</th>
          <th>Reorder Level</th>
          <th>Stock Status</th>
        </tr>
      </thead>
      <tbody id="stockTable">
        <tr>
          <td>Paracetamol</td>
          <td>50</td>
          <td>20</td>
          <td>In Stock</td>
        </tr>
        <tr>
          <td>Amoxicillin</td>
          <td>8</td>
          <td>15</td>
          <td class="low">Low Stock — Reorder</td>
        </tr>
      </tbody>
    </table>
  </main>

  <script>
    const form = document.getElementById("medicineForm");
    const table = document.getElementById("stockTable");
    const message = document.getElementById("message");

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const name = document.getElementById("medicineName").value.trim();
      const quantity = Number(document.getElementById("quantity").value);
      const reorderLevel = Number(document.getElementById("reorderLevel").value);

      if (!name || quantity < 0 || reorderLevel < 0) {
        message.textContent = "Please enter valid medicine details.";
        return;
      }

      const isLow = quantity <= reorderLevel;
      const row = document.createElement("tr");

      [name, quantity, reorderLevel].forEach(function (value) {
        const cell = document.createElement("td");
        cell.textContent = value;
        row.appendChild(cell);
      });

      const statusCell = document.createElement("td");
      statusCell.textContent = isLow ? "Low Stock — Reorder" : "In Stock";
      if (isLow) statusCell.className = "low";
      row.appendChild(statusCell);

      table.appendChild(row);
      message.textContent = "Medicine added successfully.";
      form.reset();
    });
  </script>
</body>
</html>
